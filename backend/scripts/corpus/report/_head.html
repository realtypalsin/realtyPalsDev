<title>RealtyPals Readiness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
  :root {
    --ground:  #FBFAF8;
    --surface: #FFFFFF;
    --ink:     #0F1519;
    --muted:   #6B7076;
    --rule:    #E4E0D8;
    --accent:  #1F5E56;
    --ok:      #2F6F4F;
    --warn:    #A8641B;
    --risk:    #A33A31;
    --meter-bg:#EAE7E0;

    --serif: 'Newsreader', ui-serif, Georgia, serif;
    --sans:  'Public Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono:  'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:  #0E1214;
      --surface: #161B1E;
      --ink:     #E8EDEF;
      --muted:   #98A1A6;
      --rule:    #262D31;
      --accent:  #6FBFAF;
      --ok:      #6FBF8F;
      --warn:    #D9A055;
      --risk:    #E08076;
      --meter-bg:#232A2E;
    }
  }

  :root[data-theme="dark"] {
    --ground:  #0E1214;
    --surface: #161B1E;
    --ink:     #E8EDEF;
    --muted:   #98A1A6;
    --rule:    #262D31;
    --accent:  #6FBFAF;
    --ok:      #6FBF8F;
    --warn:    #D9A055;
    --risk:    #E08076;
    --meter-bg:#232A2E;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.62;
    margin: 0;
    padding: 0 clamp(1.15rem, 5vw, 2rem) 6rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .wrap { max-width: 62rem; margin: 0 auto; }
  .prose { max-width: 40rem; }

  /* ---------- masthead ---------- */

  header.masthead {
    padding: clamp(3rem, 9vw, 5.5rem) 0 0;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .eyebrow {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(2.4rem, 6.5vw, 3.6rem);
    line-height: 1.06;
    letter-spacing: -0.018em;
    margin: 0;
    text-wrap: balance;
  }

  .standfirst {
    font-family: var(--serif);
    font-size: clamp(1.05rem, 2.4vw, 1.24rem);
    line-height: 1.5;
    color: var(--muted);
    max-width: 34rem;
    margin: 0.5rem 0 0;
  }

  /* ---------- the figure ---------- */

  .figure {
    margin: clamp(2.5rem, 6vw, 3.5rem) 0 0;
    padding: clamp(1.5rem, 4vw, 2rem);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    display: flex;
    flex-wrap: wrap;
    gap: clamp(1.25rem, 4vw, 3rem);
    align-items: flex-start;
  }

  .figure-main { display: flex; align-items: baseline; gap: 0.55rem; }

  .figure-num {
    font-family: var(--serif);
    font-size: clamp(3.6rem, 11vw, 5.2rem);
    font-weight: 600;
    line-height: 0.85;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }

  .figure-pct {
    font-family: var(--serif);
    font-size: clamp(1.4rem, 4vw, 1.9rem);
    color: var(--muted);
  }

  .figure-side { flex: 1 1 15rem; min-width: 13rem; padding-top: 0.3rem; }

  .figure-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.7rem;
  }

  .track {
    height: 3px;
    background: var(--meter-bg);
    position: relative;
    border-radius: 2px;
    overflow: hidden;
  }
  .track > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; display: block; }

  .track-scale {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 0.45rem;
    font-variant-numeric: tabular-nums;
  }

  .delta {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ok);
    margin-top: 0.9rem;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- sections ---------- */

  section { margin-top: clamp(3rem, 7vw, 4.5rem); }

  h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(1.55rem, 3.6vw, 2rem);
    line-height: 1.15;
    letter-spacing: -0.014em;
    margin: 0 0 0.35rem;
    text-wrap: balance;
  }

  .sec-note {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 1.6rem;
    max-width: 38rem;
  }

  h3 {
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 2.2rem 0 0.8rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--rule);
  }

  p { margin: 0 0 1rem; }
  strong { font-weight: 600; }
  code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: var(--meter-bg);
    padding: 0.1em 0.36em;
    border-radius: 3px;
  }

  /* ---------- shipped list ---------- */

  .shipped { display: grid; gap: 0; margin: 0; }

  .item {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.15rem;
    padding: 0.85rem 0;
    border-bottom: 1px solid var(--rule);
  }
  .item:first-child { border-top: 1px solid var(--rule); }

  .item-head {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .item-title { font-weight: 600; font-size: 0.97rem; }

  .tag {
    font-family: var(--mono);
    font-size: 0.64rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.12rem 0.4rem;
    border-radius: 3px;
    border: 1px solid currentColor;
    white-space: nowrap;
  }
  .tag.sev  { color: var(--risk); }
  .tag.perf { color: var(--accent); }
  .tag.ux   { color: var(--warn); }

  .item-why { color: var(--muted); font-size: 0.92rem; line-height: 1.55; }

  /* ---------- scorecard ---------- */

  .table-scroll { overflow-x: auto; overscroll-behavior-x: contain; }

  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; min-width: 30rem; }
  th {
    text-align: left;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 0 0.55rem;
    border-bottom: 1px solid var(--rule);
  }
  td { padding: 0.6rem 0; border-bottom: 1px solid var(--rule); vertical-align: baseline; }
  td:first-child { font-weight: 500; padding-right: 1rem; }
  th:nth-child(2), td:nth-child(2) { width: 3.2rem; text-align: right; padding-right: 0.7rem; }
  th:nth-child(3), td:nth-child(3) { width: 6.5rem; }
  td:nth-child(4) { color: var(--muted); font-size: 0.87rem; padding-left: 1rem; }

  .score {
    font-family: var(--mono);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .s-hi  { color: var(--ok); }
  .s-mid { color: var(--warn); }
  .s-lo  { color: var(--risk); }

  .bar { height: 2px; background: var(--meter-bg); position: relative; margin-top: 0.55rem; }
  .bar > i { position: absolute; inset: 0 auto 0 0; display: block; }
  .bar > i.hi  { background: var(--ok); }
  .bar > i.mid { background: var(--warn); }
  .bar > i.lo  { background: var(--risk); }

  .up {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--ok);
    margin-left: 0.35rem;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- steps ---------- */

  ol.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; }
  ol.steps > li {
    counter-increment: s;
    display: grid;
    grid-template-columns: 2.1rem 1fr;
    gap: 0.9rem;
    padding: 1.05rem 0;
    border-bottom: 1px solid var(--rule);
  }
  ol.steps > li:first-child { border-top: 1px solid var(--rule); }
  ol.steps > li::before {
    content: counter(s, decimal-leading-zero);
    font-family: var(--mono);
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--accent);
    padding-top: 0.15rem;
  }
  .step-title { font-weight: 600; margin-bottom: 0.15rem; }
  .step-body { color: var(--muted); font-size: 0.92rem; line-height: 1.55; }
  .step-cost {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 0.4rem;
    letter-spacing: 0.02em;
  }

  /* ---------- callout ---------- */

  .callout {
    border-left: 2px solid var(--accent);
    padding: 0.15rem 0 0.15rem 1.1rem;
    margin: 1.6rem 0;
    color: var(--muted);
    font-size: 0.94rem;
  }
  .callout strong { color: var(--ink); }

  .terminal {
    font-family: var(--mono);
    font-size: 0.78rem;
    line-height: 1.75;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 0.9rem 1.1rem;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    white-space: pre;
    color: var(--muted);
    margin: 1.2rem 0;
  }
  .terminal b { color: var(--ink); font-weight: 700; }

  footer {
    margin-top: clamp(3.5rem, 8vw, 5rem);
    padding-top: 1.3rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 0.83rem;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  footer .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  @media (max-width: 34rem) {
    td:nth-child(4) { display: none; }
    th:nth-child(4) { display: none; }
    table { min-width: 0; }
  }
</style>
