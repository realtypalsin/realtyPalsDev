services:
  - type: web
    name: realtypals-backend
    env: node
    nodeVersion: 22
    plan: starter
    rootDir: backend
    buildCommand: npm install --include=dev && npm run db:generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # AI providers, in FALLBACK_CHAIN order (backend/src/lib/config.ts).
      # GEMINI_API_KEY is tier 1 and was missing here, so a deploy provisioned
      # purely from this file would silently start on a fallback provider.
      - key: GEMINI_API_KEY
        sync: false
      # Off means Gemini — tier 1, and therefore nearly all traffic — cannot call
      # any tool, so floor plans, price history, cost sheets, amenities, builder
      # records and RERA lookups are unreachable and the model answers from the
      # prompt's NO LIVE LOOKUPS branch instead. Flip deliberately.
      - key: ENABLE_GEMINI_TOOLS
        value: "false"
      - key: MISTRAL_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PROVIDER
        value: none
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_RECIPIENT_NUMBER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false
